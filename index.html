<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Velvet Eclipse, the oatmeal stout from Vesper Brewing Co. in Courtenay, BC.">
  <meta name="theme-color" content="#080a10">
  <title>Velvet Eclipse · Vesper Brewing Co.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <a href="#top" class="brand" aria-label="Vesper Brewing Co. — back to top">
      <img src="assets/vesper-mark.png" alt="" width="288" height="288">
      <span>Vesper <small>Brewing Co.</small></span>
    </a>
    <nav aria-label="Page sections">
      <a href="#the-beer">The beer</a>
      <a href="#the-label">The label</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="release-name">
      <div class="hero-copy">
        <p class="eyebrow"><span aria-hidden="true"></span> <b id="hero-style">Oatmeal stout</b></p>
        <h1 id="release-name">Velvet<br>Eclipse</h1>
        <p class="lede">Dark beer. Soft landing.</p>
        <p class="hero-description">Roasted barley and oats give this dark stout its depth and smooth finish.</p>
      </div>
      <figure class="hero-art">
        <div class="halo" aria-hidden="true"></div>
        <div class="orbit orbit-outer" aria-hidden="true"></div>
        <div class="orbit orbit-inner" aria-hidden="true"></div>
        <div class="can-shadow" aria-hidden="true"></div>
        <div class="can-wrap" id="can-viewer" aria-label="Rotating Velvet Eclipse can">
          <img class="can" src="assets/velvet-eclipse-can.webp" alt="Velvet Eclipse can with a black and gold front label and deep blue artwork" width="750" height="1965">
          <canvas width="420" height="960" aria-hidden="true" hidden></canvas>
        </div>
        <figcaption><span id="can-strength">5.8% ALC/VOL</span><span>473 mL</span></figcaption>
      </figure>
    </section>

    <section id="the-beer" aria-label="The beer"></section>

    <section id="the-label" aria-label="The label"></section>
  </main>
</body>
</html>
